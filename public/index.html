<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Otel Yönetim Sistemi - Akıllı otel yönetimi için kapsamlı çözüm"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap&subset=latin,latin-ext" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap&subset=latin,latin-ext" rel="stylesheet">
    <style> body { font-family: 'Noto Sans', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; } </style>
    <title>Otel Yönetim Sistemi</title>
  </head>
  <body>
    <script>
      // GitHub Pages SPA fallback'ından gelen p parametresi varsa gerçek URL'yi geri yükle
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var p = params.get('p');
          if (p) {
            params.delete('p');
            var baseParts = window.location.pathname.split('/');
            // index.html'in bulunduğu dizin
            var basePath = baseParts.slice(0, baseParts.length - 1).join('/');
            if (!basePath.endsWith('/')) basePath += '/';
            var newUrl = basePath + decodeURIComponent(p) + (params.toString() ? ('?' + params.toString()) : '') + window.location.hash;
            window.history.replaceState(null, null, newUrl);
          }
        } catch (e) { /* sessizce geç */ }
      })();
    </script>
    <noscript>Bu uygulamayı çalıştırmak için JavaScript'i etkinleştirmeniz gerekiyor.</noscript>
    <div id="root"></div>
  </body>
</html>
