services:
  - type: web
    name: kent-otel-backend-auto
    runtime: node
    rootDir: server
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: npm ci && npm run prisma:generate && npm run build && npx prisma db push --schema ./prisma/schema.prisma
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kent-otel-db
          property: connectionString
      - key: NPM_CONFIG_PRODUCTION
        value: false
      - key: PRISMA_GENERATE
        value: enabled
      - key: NODE_VERSION
        value: 18.18.0
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://xoser24.github.io/otelapp,https://otel-yonetim-frontend-auto.onrender.com

  - type: web
    name: otel-yonetim-frontend-auto
    runtime: static
    rootDir: .
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: REACT_APP_SOCKET_URL
        value: https://kent-otel-backend-auto.onrender.com

databases:
  - name: kent-otel-db
    plan: free