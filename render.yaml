services:
  - type: web
    name: kent-otel-backend-auto
    env: node
    rootDir: server
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: npm ci && npm run prisma:generate && npm run build
    preDeployCommand: npx prisma db push --schema ./prisma/schema.prisma
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kent-otel-db
          property: connectionString
      - key: PRISMA_GENERATE
        value: enabled
      - key: NODE_VERSION
        value: 18.18.0
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://xoser24.github.io/otelapp

databases:
  - name: kent-otel-db
    plan: free

staticSites:
  - name: otel-yonetim-frontend-auto
    rootDir: .
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run build
    publishPath: build
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: REACT_APP_SOCKET_URL
        value: https://kent-otel-backend-auto.onrender.com