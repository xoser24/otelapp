services:
  - type: web
    name: kent-otel-backend
    env: node
    rootDir: server
    plan: free
    buildCommand: npm ci && npm run prisma:generate && npx prisma db push && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromSecret: DATABASE_URL
      - key: CORS_ORIGIN
        value: https://your-vercel-project.vercel.app

staticSites:
  - name: otel-yonetim-frontend
    rootDir: .
    plan: free
    buildCommand: npm ci && npm run build
    publishPath: build