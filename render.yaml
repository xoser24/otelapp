databases:
  - name: kent-otel-db-auto
    plan: free

services:
  - type: web
    name: kent-otel-backend-auto
    env: node
    rootDir: server
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: npm ci && npm run prisma:generate && npx prisma db push --schema ../prisma/schema.prisma && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: kent-otel-db-auto
      - key: CORS_ORIGIN
        value: https://xoser24.github.io/otelapp

staticSites:
  - name: otel-yonetim-frontend-auto
    rootDir: .
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run build
    publishPath: build
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: REACT_APP_SOCKET_URL
        value: https://kent-otel-backend-auto.onrender.com